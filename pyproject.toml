[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahmad-agent"
version = "0.1.0"
description = "Ahmad Agent - local-first governed AI agent runtime"
requires-python = ">=3.11"
dependencies = [
    "sqlcipher3-binary>=0.6,<0.7",
]

[project.scripts]
ahmad-sqlite-migrate = "ahmad.memory.sqlite_migrate:main"
ahmad-dashboard = "ahmad.dashboard:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pyrefly>=0.20",
]
industrial = [
    "python-can>=4.4,<5",
    "pymodbus>=3.8,<4",
    "scipy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mutmut]
paths_to_mutate = ["src/ahmad/"]
tests_dir = ["tests/"]
runner = "python -m pytest -x -q"

[tool.pytest.ini_options]
testpaths = ["tests", "dialect"]
norecursedirs = ["mutants", ".venv", "build", "dist", ".git", "__pycache__"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
check_untyped_defs = true
show_error_codes = true
warn_unused_ignores = true

[tool.pyrefly]
project-includes = ["src"]
search-path = ["src"]
python-version = "3.11.0"
preset = "legacy"
check-unannotated-defs = true
infer-return-types = "never"
