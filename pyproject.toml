[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahmad-agent"
version = "0.1.0"
description = "Ahmad Agent - local-first governed AI agent runtime"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mutmut]
paths_to_mutate = ["src/ahmad/"]
tests_dir = ["tests/"]
runner = "python -m pytest -x -q"
