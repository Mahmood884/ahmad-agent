# مصدر مُنسَّق من المستخدم — مقاييس الحفاوة في التحية البحرينية (2026-10-13)
#
# المصدر الأول (948) + الثاني (835 antigravity) ما يغطّون تحية البحرية
# المتدرّجة. المستخدم زوّد التقاطيع الحقيقية:
#
#   low    → هلا (مجردة)
#   medium → هلا والله / هلا بيك / هلا بيهم   (قسم أو خطاب شخصي)
#   high   → هلا والله اسفرت وانورة واستهلت وأمطرت هلا ووينك اخبارك ويش مسوي
#            (تصوير شعري: اسفرت وانورة / استهلت / وأمطرت
#             + استفلام متابعة: ووينك / أخبارك / وش مسوي)
#
# قاعدة التركيب (موثّقة في ontology.yaml كمفهوم):
#   تحية مجردة → low
#   + قسم (والله) أو خطاب (بيك/بيهم/بكم/فيك) → medium
#   + تصوير شعري أو استفلام متابعة → high
#
# الأولوية في الدمج: الأعلى (المستخدم = مصدر الحقيقة) — يحدّث هلا الموجودة
# ويضيف التقاطيع الجديدة.

entries:

  # ── low: التحية المجردة ────────────────────────────────────────────────────
  - term: هلا
    meaning: "مرحباً — تحية مجردة، أدنى درجة حفاوة"
    examples:
      - هلا
    synonyms: [أهلا, مرحبا]
    usage:
      lexical_tone: friendly
      lexical_class: greeting
      speaker_intent: context-dependent
      warmth: low

  # ── medium: تحية + قسم أو خطاب شخصي ────────────────────────────────────────
  - term: هلا والله
    meaning: "مرحباً والله — قسم يرفع الحفاوة إلى المتوسطة"
    examples:
      - هلا والله
    synonyms: []
    usage:
      lexical_tone: friendly
      lexical_class: greeting
      speaker_intent: context-dependent
      warmth: medium

  - term: هلا بيك
    meaning: "مرحباً بك — خطاب شخصي مباشر، حفاوة متوسطة"
    examples:
      - هلا بيك
    synonyms: [هلا فيك]
    usage:
      lexical_tone: friendly
      lexical_class: greeting
      speaker_intent: context-dependent
      warmth: medium

  - term: هلا بيهم
    meaning: "مرحباً بهم — خطاب شخصي للغائب/الجماعة، حفاوة متوسطة"
    examples:
      - هلا بيهم
    synonyms: [هلا بكم]
    usage:
      lexical_tone: friendly
      lexical_class: greeting
      speaker_intent: context-dependent
      warmth: medium

  # ── high: التقاطيع التي ترفع الحفاوة للعليا ────────────────────────────────
  - term: اسفرت وانورة
    meaning: "أشرقت وأضاءت — تصوير شعري: المكان استنار بمقدم المقابل"
    examples:
      - هلا والله اسفرت وانورة
    synonyms: []
    usage:
      lexical_tone: friendly
      lexical_class: greeting
      speaker_intent: context-dependent
      warmth: high

  - term: استهلت
    meaning: "هلّلت — تصوير شعري: ندوء الفرح بمقدم المقابل (استهلال)"
    examples:
      - واستهلت
    synonyms: []
    usage:
      lexical_tone: friendly
      lexical_class: greeting
      speaker_intent: context-dependent
      warmth: high

  - term: وأمطرت
    meaning: "وأمطرت — تصوير شعري: السماء أمطرت بمقدم المقابل (مطر البركة)"
    examples:
      - وأمطرت
    synonyms: []
    usage:
      lexical_tone: friendly
      lexical_class: greeting
      speaker_intent: context-dependent
      warmth: high

  - term: ووينك
    meaning: "وين أنت — استفلام متابعة يرفع الحفاوة للعليا"
    examples:
      - ووينك
    synonyms: [وينك]
    usage:
      lexical_tone: friendly
      lexical_class: greeting
      speaker_intent: context-dependent
      warmth: high

  - term: أخبارك
    meaning: "ما أخبارك — استفلام متابعة (الحال والخبر)"
    examples:
      - اخبارك
    synonyms: [أخبارك, اخبارك]
    usage:
      lexical_tone: friendly
      lexical_class: greeting
      speaker_intent: context-dependent
      warmth: high

  - term: وش مسوي
    meaning: "وش تسوي — استفلام متابعة (النشاط الحالي)"
    examples:
      - ويش مسوي
    synonyms: [وش تسوي, ويش مسوي]
    usage:
      lexical_tone: friendly
      lexical_class: greeting
      speaker_intent: context-dependent
      warmth: high

  # ── المركّب الكامل: أقصى حفاوة موثّقة من المستخدم ──────────────────────────
  - term: هلا والله اسفرت وانورة واستهلت وأمطرت هلا ووينك اخبارك ويش مسوي
    meaning: "التحية البحرية الكاملة بأقصى حفاوة — قسم + تصوير شعري + استفلام متابعة"
    examples:
      - هلا والله اسفرت وانورة واستهلت وأمطرت هلا ووينك اخبارك ويش مسوي
    synonyms: []
    usage:
      lexical_tone: friendly
      lexical_class: greeting
      speaker_intent: context-dependent
      warmth: high
